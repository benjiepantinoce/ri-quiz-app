<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Innovations - Secure Lecture Replay</title>
    <style>
        :root {
            --bg-color: #f7f9f4;
            --card-bg: #ffffff;
            --text-main: #1e2923;
            --ri-green: #115e2e;
            --ri-yellow: #facc15;
            --border-color: #d8e2d4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 960px;
            padding: 16px;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .video-wrapper {
            position: relative;
            background: #000;
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Active moving security watermark */
        #watermark {
            position: absolute;
            top: 20%;
            left: 15%;
            color: rgba(255, 255, 255, 0.25);
            font-size: clamp(16px, 2.5vw, 24px);
            font-weight: 700;
            pointer-events: none;
            user-select: none;
            transition: all 25s ease-in-out;
            z-index: 10;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .video-meta {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .video-meta h3 {
            margin: 0 0 6px 0;
            color: var(--ri-green);
            font-size: 20px;
        }

        .video-desc {
            font-size: 14px;
            color: #555;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="player-card">
            <div class="video-wrapper">
                <!-- Floating security watermark layer -->
                <div id="watermark">SECURE REPLAY</div>
                <!-- Direct Video Stream Embed -->
                <iframe src="https://rionline.sharepoint.com/sites/RIInstructors/_layouts/15/embed.aspx?UniqueId=IQDVfJCZ7qTMSbIJFLQMQ7KHAfnPKwIkdeKqzbbODh211-k&embedOptions=true" allowfullscreen></iframe>
            </div>
            <div class="video-meta">
                <h3>Review Innovations Lecture Replay</h3>
                <p class="video-desc">Protected intellectual property stream. Do not share or record.</p>
            </div>
        </div>
    </div>

    <script>
        // Generates the security watermark from URL parameters (e.g. ?user=StudentName) or defaults safely
        function initWatermark() {
            const urlParams = new URLSearchParams(window.location.search);
            const studentName = urlParams.get('user') || "Reviewee";
            
            const watermark = document.getElementById('watermark');
            const dateStr = new Date().toISOString().slice(0, 10);
            watermark.textContent = `${studentName} • ${dateStr}`;

            // Slowly shift watermark position every 25 seconds across the video frame
            setInterval(() => {
                watermark.style.top = `${Math.floor(Math.random() * 70) + 10}%`;
                watermark.style.left = `${Math.floor(Math.random() * 50) + 10}%`;
            }, 25000);
        }

        initWatermark();
    </script>
</body>
</html>
